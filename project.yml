name: Tidy
options:
  bundleIdPrefix: dev.gustaf
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  TidyCore:
    path: Packages/TidyCore

settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  Tidy:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # XcodeGen has no `resources` key; the asset catalog must be listed as a source.
      - path: Resources/Assets.xcassets
    dependencies:
      - package: TidyCore
    settings:
      base:
        PRODUCT_NAME: Tidy
        PRODUCT_BUNDLE_IDENTIFIER: dev.gustaf.tidy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Tidy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHumanReadableCopyright: "Tidy"
    scheme: {}
